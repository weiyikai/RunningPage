name: Garmin CN to Global Sync

on:
  workflow_dispatch:
    inputs:
      reverse:
        description: '反向同步（国际服 → 国内服），默认关闭'
        required: false
        type: boolean
        default: false
  schedule:
    # 每天凌晨 3:00 北京时间 = 19:00 UTC
    - cron: '0 19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    name: Sync Garmin (CN <-> Global)
    # 自托管 runner：跑在你自己的 Windows 机器上，用住宅 IP 访问 Garmin，
    # 规避 GitHub 托管 runner 的数据中心 IP 被 429 限流 + DNS 解析失败的问题。
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Garmin
        env:
          # 自动续期：这里不再使用预生成的 secret string，而是每次用账号密码
          # 重新登录/刷新，避免 oauth1 token 过期导致同步失败。
          GARMIN_CN_EMAIL: ${{ secrets.GARMIN_CN_EMAIL }}
          GARMIN_CN_PASSWORD: ${{ secrets.GARMIN_CN_PASSWORD }}
          GARMIN_GLOBAL_EMAIL: ${{ secrets.GARMIN_GLOBAL_EMAIL }}
          GARMIN_GLOBAL_PASSWORD: ${{ secrets.GARMIN_GLOBAL_PASSWORD }}
        run: python run_page/garmin_sync_cn_global.py ${{ inputs.reverse && '--reverse' || '' }}

      - name: Push new activities
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          git commit -m 'sync garmin activities' || echo 'nothing to commit'
          git push || echo 'nothing to push'

  publish_github_pages:
    needs: sync
    if: needs.sync.result == 'success'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: false
      data_cache_prefix: track_data
